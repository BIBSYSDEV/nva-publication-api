plugins {
    id 'nva.java-conventions'
    id 'java-test-fixtures'
}

nva {
    generatedCode = [
        'no/scopus/generated/**',
        'no/unit/nva/model/testing/**'
    ]
    java {
        languageVersion = 25
    }
    pmd {
        rulesetFile = rootProject.file('config/pmd/ruleset.xml')
    }
}

dependencies {
    implementation(platform(nvaCatalog.aws.sdk2.bom))
    testImplementation(platform(nvaCatalog.junit.bom))
    testRuntimeOnly(nvaCatalog.junit.jupiter.engine)
    testRuntimeOnly(nvaCatalog.junit.platform.launcher)
}

tasks.named('test') {
    environment("API_HOST", "localhost")
    // DynamoDBLocal loads the native sqlite4java library via System.load,
    // which JDK 24+ (JEP 472) blocks unless native access is granted.
    jvmArgs '--enable-native-access=ALL-UNNAMED'
}

tasks.withType(JavaCompile).configureEach {
    // Disabled because of a bug in ErrorProne (https://github.com/google/error-prone/issues/4918)
    options.errorprone.disable("StringConcatToTextBlock")
}
