plugins {
    id 'application'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

// The local harness — anything that weakens authentication to make manual testing easier —
// is kept out of `main` so it cannot reach the distribution. Using it from production code
// is a compile error rather than a configuration mistake.
sourceSets {
    local {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

configurations {
    localImplementation.extendsFrom implementation
    localRuntimeOnly.extendsFrom runtimeOnly
}

dependencies {
    implementation project(':publication-rest')
    implementation(project(':publication-commons')) {
        exclude group: "software.amazon.ion", module: "ion-java"
    }
    implementation project(':publication-constants')
    implementation project(':publication-model')
    implementation project(':tickets')
    implementation project(':publication-log')
    implementation project(':publication-file')

    implementation nvaLibs.apigateway
    implementation nvaLibs.core
    implementation nvaLibs.auth
    implementation nvaLibs.clients
    implementation nvaLibs.json

    implementation nvaCatalog.aws.lambda.core
    implementation nvaCatalog.aws.sdk2.dynamo
    implementation nvaCatalog.aws.sdk2.s3
    implementation nvaCatalog.jackson.databind
    implementation nvaCatalog.log4j.core
    implementation nvaCatalog.slf4j.api

    implementation libs.javalin
    implementation libs.swagger.core

    testImplementation platform(nvaCatalog.junit.bom)
    testImplementation nvaCatalog.junit.jupiter.api
    testImplementation nvaCatalog.hamcrest
    testImplementation nvaCatalog.mockito.core
    // Tests drive the adapter through the harness, so they see the local source set too
    testImplementation sourceSets.local.output
    // Embedded DynamoDB is a test fixture only — the adapter itself talks to a configured endpoint
    testImplementation(nvaCatalog.aws.sdk2.dynamodblocal) {
        exclude group: 'com.amazonaws', module: 'aws-java-sdk-dynamodb'
        exclude group: 'com.amazonaws', module: 'aws-java-sdk-core'
        exclude group: 'org.eclipse.jetty'
        exclude group: 'org.eclipse.jetty.ee10'
        exclude group: 'org.eclipse.jetty.ee10.websocket'
    }
    testRuntimeOnly nvaCatalog.junit.jupiter.engine
    testRuntimeOnly nvaCatalog.junit.platform.launcher
}

application {
    mainClass = 'no.unit.nva.publication.adapter.AdapterApplication'
}

// Settings the handlers read at construction time. Anything already set in the shell
// wins, so a single export is enough to point at a different service.
def localDefaults = { String mockUrl ->
    [
        ALLOWED_ORIGIN           : '*',
        API_HOST                 : 'localhost',
        AWS_ACCESS_KEY_ID        : 'local',
        AWS_SECRET_ACCESS_KEY    : 'localsecret',
        AWS_REGION               : 'eu-west-1',
        BACKEND_CLIENT_AUTH_URL  : mockUrl,
        BACKEND_CLIENT_SECRET_NAME: 'backend-client',
        COGNITO_AUTHORIZER_URLS  : 'http://localhost:3000',
        COGNITO_HOST             : mockUrl,
        CUSTOM_DOMAIN_BASE_PATH  : 'publication',
        EXTERNAL_USER_POOL_URI   : "$mockUrl/external",
        ID_NAMESPACE             : 'https://www.example.org/publication',
        NVA_EVENT_BUS_NAME       : 'local-event-bus',
        NVA_FRONTEND_DOMAIN      : 'localhost',
        NVA_PERSISTED_STORAGE_BUCKET_NAME: 'nva-resource-storage',
        SHORTENED_URI_TABLE_NAME : 'nva-download-url-shortener',
        TABLE_NAME               : 'nva-resources',
        SECRETS_DIR              : project.file('local/secrets').absolutePath
    ].collectEntries { name, value -> [name, System.getenv(name) ?: value] }
}

tasks.named('test') {
    useJUnitPlatform()
    // DynamoDBLocal loads sqlite4java via System.load, blocked by JEP 472 without this
    jvmArgs '--enable-native-access=ALL-UNNAMED'
    environment localDefaults(AdapterTestPorts.MOCK_URL)
    // Fixed so the adapter and the tests agree on where the Cognito stub listens
    environment 'MOCK_PORT', AdapterTestPorts.MOCK_PORT
}

// `docker compose -f publication-adapter-rest/compose.yaml --profile dynamodb up -d`
// then `./gradlew :publication-adapter-rest:run` — no exports needed. Point at the
// ExtendDB profile by exporting AWS_ENDPOINT_URL_DYNAMODB and friends instead.
// Everything needed to talk to the services in compose.yaml, shared by both entry points
def runEnvironment = {
    localDefaults('http://localhost:8090') + [
        OPENAPI_PATH             : rootProject.file('docs/openapi.yaml').absolutePath,
        // Keycloak from compose.yaml, so bearer tokens are validated against real JWKS
        COGNITO_AUTHORIZER_URLS  : 'http://localhost:8091/realms/nva',
        AWS_ENDPOINT_URL_DYNAMODB: 'http://localhost:8000',
        AWS_ENDPOINT_URL_S3      : 'http://localhost:8333',
        S3_FORCE_PATH_STYLE      : 'true'
    ].collectEntries { name, value -> [name, System.getenv(name) ?: value] }
}

// Runs the harness entry point, which trusts the X-Adapter-Authorizer header
tasks.named('run') {
    classpath = sourceSets.local.runtimeClasspath
    mainClass = 'no.unit.nva.publication.adapter.local.LocalAdapterApplication'
    environment runEnvironment()
}

// Runs what would actually be deployed: no harness classes on the classpath, so the
// header bypass does not exist and a bearer token is the only way in.
tasks.register('runDist', Exec) {
    group = 'application'
    description = 'Runs the installed distribution, without the local harness'
    dependsOn tasks.named('installDist')
    commandLine layout.buildDirectory
                    .file("install/${project.name}/bin/${project.name}")
                    .get().asFile.absolutePath
    environment runEnvironment()
    // The start script picks up JAVA_HOME, which on most machines is older than the
    // toolchain this is compiled with. A deployment image needs a JRE 25 for the same reason.
    environment 'JAVA_HOME', javaToolchains.launcherFor(java.toolchain)
                                 .get().metadata.installationPath.asFile.absolutePath
}

class AdapterTestPorts {
    static final String MOCK_PORT = '8095'
    static final String MOCK_URL = "http://localhost:$MOCK_PORT"
}
